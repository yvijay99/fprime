name: 'Setup F´'
description: 'Setup the F´ repository and tools'
inputs:
  location:
    required: true
    default: $GITHUB_WORKSPACE
runs:
  using: "composite"
  steps:
    - run: git fetch --tags
      shell: bash
    # Python path should be added at a higher level
    - run: python3 -m venv venv
      shell: bash

    - run: ./venv/bin/pip install setuptools_scm wheel urllib3
      shell: bash

    - run: ./venv/bin/pip install -U -r ${{ inputs.location }}/requirements.txt
      shell: bash

    # Add venv bin to PATH
    - run: echo "$GITHUB_WORKSPACE/venv/bin" >> $GITHUB_PATH
      shell: bash

    - run: which fprime-util
      shell: bash

    - run: which fprime-gds
      shell: bash

    - run: which fpp-check
      shell: bash
