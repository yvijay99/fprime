# Cross-compile https://github.com/fprime-community/fprime-workshop-led-blinker
# Runs integration tests on aarch64-linux

name: "External Repo: AArch64 Linux Yamcs Reference"

on:
  push:
    branches: [YAMCSCI]
  workflow_dispatch:
# Cancel in-progress runs if a newer run is started
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read

jobs:
  get-branch:
    name: "Get target branch"
    uses: ./.github/workflows/reusable-get-pr-branch.yml
    with:
      target_repository: yvijay99/fprime-yamcs-reference
      default_target_ref: yamcsPOC 

  cross-compilation:
    name: "Cross Compilation"
    runs-on: ubuntu-22.04
    needs: get-branch
    steps:
      - name: "Setup external repository + overlay F´"
        uses: nasa/fprime-actions/external-repository-setup@devel
        with:
          target_repository: yvijay99/fprime-yamcs-reference
          target_ref: testingyamcsclient
      - name: "Cross compile"
        uses: nasa/fprime-actions/build-with-aarch64-toolchain@devel
      - name: "Prepare artifacts"
        run: |
          mkdir -p aarch64-linux-artifacts/int
          cp -r ./build-artifacts aarch64-linux-artifacts
          # Copy integration tests from fprime submodule - preserve directory structure
          for test_dir in lib/fprime/Svc/*/test/int lib/fprime/Ref/test/int; do
            if [ -d "$test_dir" ]; then
              component=$(echo $test_dir | cut -d'/' -f3-4)
              mkdir -p "aarch64-linux-artifacts/int/$component"
              cp -r "$test_dir"/* "aarch64-linux-artifacts/int/$component/" 2>/dev/null || true
            fi
          done
          # Also copy YAMCS-specific deployment tests if they exist
          if [ -d "FprimeYamcsReference/YamcsDeployment/test/int" ]; then
            mkdir -p aarch64-linux-artifacts/int/deployment
            cp -r FprimeYamcsReference/YamcsDeployment/test/int/* aarch64-linux-artifacts/int/deployment/
          fi          

      - name: "Archive Build Artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: aarch64-linux-artifacts
          path: aarch64-linux-artifacts
          retention-days: 5

  aarch64-integration:
    name: "AArch64 Linux Integration Tests"
    runs-on: ubuntu-22.04-arm
    needs: cross-compilation
    steps:
      - name: "Checkout F´ Repository"
        uses: actions/checkout@v4
        with:
          sparse-checkout: "requirements.txt"
          sparse-checkout-cone-mode: false
      - name: "Setup environment"
        run: |
          python -m venv venv
          . venv/bin/activate
          pip install -r requirements.txt
          echo "${PWD}/venv/bin" >> "${GITHUB_PATH}"
      # Upgrade GDS to yamcsPOC branch if it exists
      - name: "Upgrade fprime-gds to yamcsPOC"
        uses: nasa/fprime-actions/upgrade-package@devel
        with:
          repository: yvijay99/fprime-gds
          default-branch: yamcsPOC
      # Upgrade fprime-yamcs to yamcsPOC branch if it exists
      - name: "Upgrade fprime-yamcs to yamcsPOC"
        uses: nasa/fprime-actions/upgrade-package@devel
        with:
          repository: yvijay99/fprime-yamcs
          default-branch: yamcsPOC
      - name: "Artifacts Download"
        uses: actions/download-artifact@v8
        with:
          name: aarch64-linux-artifacts
      - name: "Clear pytest cache"
        run: |
          find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true
      - name: Run Integration Tests
        run: |
           DEPLOYMENT=FprimeYamcsReference_YamcsDeployment
            . venv/bin/activate
            mkdir -p ci-logs
            chmod +x ./build-artifacts/aarch64-linux/${DEPLOYMENT}/bin/${DEPLOYMENT}
            fprime-yamcs --ip-client -d ./build-artifacts/aarch64-linux/${DEPLOYMENT} --logs ./ci-logs &
            sleep 10
            pytest --cache-clear --dictionary ./build-artifacts/aarch64-linux/${DEPLOYMENT}/dict/YamcsDeploymentTopologyDictionary.json ./int/deployment/
      - name: "Archive logs"
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: aarch64-linux-logs
          path: ci-logs
          retention-days: 5
