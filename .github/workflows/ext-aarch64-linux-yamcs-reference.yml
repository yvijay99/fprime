# Cross-compile https://github.com/fprime-community/fprime-workshop-led-blinker
# Runs integration tests on aarch64-linux

name: "External Repo: AArch64 Linux Yamcs Reference"

on:
  push:
    branches: [YAMCSCI]
  workflow_dispatch:
# Cancel in-progress runs if a newer run is started
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read

jobs:
  get-branch:
    name: "Get target branch"
    uses: ./.github/workflows/reusable-get-pr-branch.yml
    with:
      target_repository: yvijay99/fprime-yamcs-reference
      default_target_ref: yamcsPOC 

  cross-compilation:
    name: "Cross Compilation"
    runs-on: ubuntu-22.04
    needs: get-branch
    steps:
      - name: "Setup external repository + overlay F´"
        uses: nasa/fprime-actions/external-repository-setup@devel
        with:
          target_repository: yvijay99/fprime-yamcs-reference
          target_ref: testingyamcsclient
      - name: "Cross compile"
        uses: nasa/fprime-actions/build-with-aarch64-toolchain@devel
      - name: "Prepare artifacts"
        run: |
          mkdir -p aarch64-linux-artifacts/int
          cp -r ./build-artifacts aarch64-linux-artifacts
          # Copy integration tests from fprime submodule - preserve directory structure
          for test_dir in lib/fprime/Svc/*/test/int lib/fprime/Ref/test/int; do
            if [ -d "$test_dir" ]; then
              component=$(echo $test_dir | cut -d'/' -f3-4)
              mkdir -p "aarch64-linux-artifacts/int/$component"
              cp -r "$test_dir"/* "aarch64-linux-artifacts/int/$component/" 2>/dev/null || true
            fi
          done
          # Also copy YAMCS-specific deployment tests if they exist
          if [ -d "FprimeYamcsReference/YamcsDeployment/test/int" ]; then
            mkdir -p aarch64-linux-artifacts/int/deployment
            cp -r FprimeYamcsReference/YamcsDeployment/test/int/* aarch64-linux-artifacts/int/deployment/
          fi          

      - name: "Archive Build Artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: aarch64-linux-artifacts
          path: aarch64-linux-artifacts
          retention-days: 5

  discover-tests:
    name: "Discover Integration Tests"
    runs-on: ubuntu-22.04
    needs: cross-compilation
    outputs:
      tests: ${{ steps.list-tests.outputs.tests }}
    steps:
      - name: "Download build artifacts"
        uses: actions/download-artifact@v8
        with:
          name: aarch64-linux-artifacts
      - name: "Generate test matrix from artifacts"
        id: list-tests
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          # Discover all test files from the artifacts
          test_dir = Path("int/deployment")
          if test_dir.exists():
              tests = sorted([
                  str(test_file.relative_to("."))
                  for test_file in test_dir.glob("test_*.py")
              ])
          else:
              # Fallback to explicit list if discovery fails
              tests = [
                  "int/deployment/test_cdh_core.py",
                  "int/deployment/test_cmd_PrmDb.py",
                  "int/deployment/test_cmd_dispatcher.py",
                  "int/deployment/test_cmd_dpCatalog.py",
                  "int/deployment/test_cmd_dpMgr.py",
                  "int/deployment/test_cmd_dpWriter.py",
                  "int/deployment/test_cmd_eventManager.py",
                  "int/deployment/test_cmd_fileDownlink.py",
                  "int/deployment/test_cmd_fileManager.py",
                  "int/deployment/test_cmd_health.py",
                  "int/deployment/test_cmd_sequencer.py",
                  "int/deployment/test_cmd_systemResources.py",
                  "int/deployment/test_cmd_uplink.py",
                  "int/deployment/test_cmd_version.py",
                  "int/deployment/test_file_handling.py",
              ]

          print(f"Found {len(tests)} test files")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"tests={json.dumps(tests)}\n")
          PY

  setup-test-environment:
    name: "Setup Base Test Environment"
    runs-on: ubuntu-22.04-arm
    needs: cross-compilation
    steps:
      - name: "Checkout F´"
        uses: actions/checkout@v4
        with:
          sparse-checkout: "requirements.txt"
          sparse-checkout-cone-mode: false

      - name: "Setup Python virtual environment with base dependencies"
        run: |
          python -m venv venv
          . venv/bin/activate
          pip install -r requirements.txt

      - name: "Archive base virtual environment"
        uses: actions/upload-artifact@v7
        with:
          name: base-test-venv
          path: venv
          retention-days: 1

  aarch64-integration:
    name: "Test: ${{ matrix.test_file }}"
    runs-on: ubuntu-22.04-arm
    needs: [cross-compilation, discover-tests, setup-test-environment]
    strategy:
      fail-fast: false
      matrix:
        test_file: ${{ fromJSON(needs.discover-tests.outputs.tests) }}
    env:
      DEPLOYMENT: FprimeYamcsReference_YamcsDeployment
    steps:
      - name: "Download build artifacts"
        uses: actions/download-artifact@v8
        with:
          name: aarch64-linux-artifacts

      - name: "Download base test environment"
        uses: actions/download-artifact@v8
        with:
          name: base-test-venv
          path: venv

      - name: "Setup Java 17 for YAMCS"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: "Prepare test environment and install latest packages"
        run: |
          # Add venv to PATH
          echo "${PWD}/venv/bin" >> "${GITHUB_PATH}"
          # Activate venv and install latest fprime-gds and fprime-yamcs
          . venv/bin/activate
          pip install --upgrade git+https://github.com/yvijay99/fprime-gds.git@yamcsPOC
          pip install --upgrade git+https://github.com/yvijay99/fprime-yamcs.git@yamcsPOC
          # Verify yamcs-client is installed
          python -c "import yamcs.tmtc; print('yamcs-client installed successfully')"
          # Clean up Python cache
          find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true
          # Make deployment executable
          chmod +x ./build-artifacts/aarch64-linux/${DEPLOYMENT}/bin/${DEPLOYMENT}
          mkdir -p ci-logs

      - name: "Start F´ deployment with YAMCS"
        run: |
          . venv/bin/activate
          fprime-yamcs --ip-client \
            -d ./build-artifacts/aarch64-linux/${DEPLOYMENT} \
            --logs ./ci-logs &
          sleep 10

      - name: "Run test: ${{ matrix.test_file }}"
        run: |
          . venv/bin/activate
          pytest --cache-clear \
            --dictionary ./build-artifacts/aarch64-linux/${DEPLOYMENT}/dict/YamcsDeploymentTopologyDictionary.json \
            -v \
            ${{ matrix.test_file }}

      - name: "Archive test logs"
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-logs-${{ strategy.job-index }}
          path: ci-logs
          retention-days: 5
