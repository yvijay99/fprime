# Cross-compile https://github.com/yvijay99/fprime-yamcs-reference
# Runs integration tests on aarch64-linux

name: "External Repo: AArch64 Linux Yamcs Reference"

on:
  push:
    branches: [YAMCSCI]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cross-compilation:
    name: "Cross Compilation"
    runs-on: ubuntu-22.04
    steps:
      - name: "Setup external repository + overlay F´"
        uses: nasa/fprime-actions/external-repository-setup@devel
        with:
          target_repository: yvijay99/fprime-yamcs-reference
          target_ref: testingyamcsclient
      - name: "Cross compile"
        uses: nasa/fprime-actions/build-with-aarch64-toolchain@devel
      - name: "Prepare artifacts"
        run: |
          mkdir -p aarch64-linux-artifacts
          cp -r ./build-artifacts aarch64-linux-artifacts
          cp -r FprimeYamcsReference/YamcsDeployment/test/int aarch64-linux-artifacts
      - name: "Archive Build Artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: aarch64-linux-artifacts
          path: aarch64-linux-artifacts
          retention-days: 5

  discover-tests:
    name: "Discover Integration Tests"
    runs-on: ubuntu-22.04
    needs: cross-compilation
    outputs:
      tests: ${{ steps.list-tests.outputs.tests }}
    steps:
      - name: "Download build artifacts"
        uses: actions/download-artifact@v8
        with:
          name: aarch64-linux-artifacts
      - name: "Generate test matrix from artifacts"
        id: list-tests
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          test_dir = Path("int")
          tests = sorted([
              str(test_file.relative_to("."))
              for test_file in test_dir.glob("test_*.py")
          ])

          print(f"Found {len(tests)} test files")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"tests={json.dumps(tests)}\n")
          PY

  setup-test-environment:
    name: "Setup Base Test Environment"
    runs-on: ubuntu-22.04-arm
    needs: cross-compilation
    steps:
      - name: "Checkout F´"
        uses: actions/checkout@v4
        with:
          sparse-checkout: "requirements.txt"
          sparse-checkout-cone-mode: false
      - name: "Setup Python virtual environment with base dependencies"
        run: |
          python -m venv venv
          . venv/bin/activate
          pip install --upgrade pip setuptools
          pip install -r requirements.txt
      - name: "Archive base virtual environment"
        uses: actions/upload-artifact@v7
        with:
          name: base-test-venv
          path: venv
          retention-days: 1

  aarch64-integration:
    name: "Test: ${{ matrix.test_file }}"
    runs-on: ubuntu-22.04-arm
    needs: [cross-compilation, discover-tests, setup-test-environment]
    strategy:
      fail-fast: false
      matrix:
        test_file: ${{ fromJSON(needs.discover-tests.outputs.tests) }}
    env:
      DEPLOYMENT: FprimeYamcsReference_YamcsDeployment
    steps:
      - name: "Download build artifacts"
        uses: actions/download-artifact@v8
        with:
          name: aarch64-linux-artifacts

      - name: "Download base test environment"
        uses: actions/download-artifact@v8
        with:
          name: base-test-venv
          path: venv

      - name: "Setup Java 17 for YAMCS"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: "Install YAMCS packages"
        run: |
          chmod +x venv/bin/*
          . venv/bin/activate
          pip install git+https://github.com/yvijay99/fprime-gds.git@yamcsPOC
          pip install git+https://github.com/yvijay99/fprime-yamcs.git@yamcsPOC
          echo "${PWD}/venv/bin" >> "${GITHUB_PATH}"

      - name: "Prepare deployment"
        run: |
          chmod +x ./build-artifacts/aarch64-linux/${DEPLOYMENT}/bin/${DEPLOYMENT}
          mkdir -p ci-logs

      - name: "Start F´ deployment with YAMCS"
        run: |
          . venv/bin/activate
          fprime-yamcs --ip-client -d ./build-artifacts/aarch64-linux/${DEPLOYMENT} --logs ./ci-logs &
          sleep 15

      - name: "Run test: ${{ matrix.test_file }}"
        run: |
          . venv/bin/activate
          pytest --dictionary ./build-artifacts/aarch64-linux/${DEPLOYMENT}/dict/YamcsDeploymentTopologyDictionary.json \
            --deployment-config ./int/int_config.json \
            -v \
            ${{ matrix.test_file }}

      - name: "Archive test logs"
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-logs-${{ strategy.job-index }}
          path: ci-logs
          retention-days: 5
